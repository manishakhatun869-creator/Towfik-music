name: Build Towfik Music APK

on:
  push:
    branches: [main, arena/01a08ecb-towfik-music]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check home navigation regressions
        run: python3 scripts/check_navigation.py
      - name: Test and build Debug APK
        run: |
          set -o pipefail
          ./gradlew :app:testUniversalDebugUnitTest :app:assembleUniversalDebug 2>&1 | tee /tmp/towfik-build.log
      - name: Annotate build failures
        if: failure()
        run: python3 scripts/annotate_build_failure.py /tmp/towfik-build.log
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Towfik-Music-Test-Reports
          path: app/build/reports/tests/
          if-no-files-found: warn
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Towfik-Music-Debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
